[tox]
requires = tox>4
env_list = ruff, mypy
isolated_build = true

[testenv]
skip_install = true

[testenv:ruff]
description = run ruff
deps = ruff
commands = 
    ruff format wordsea
    ruff check wordsea --fix

[testenv:mypy]
runner = uv-venv-lock-runner
description = run mypy
commands =
    mypy wordsea
