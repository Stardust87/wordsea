[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordsea"
version = "0.0.0"
dependencies = [
    "beautifulsoup4",
    "click",
    "diffusers",
    "jinja2",
    "ninja",
    "mongoengine",
    "pandas",
    "peft",
    "sentencepiece",
    "tqdm",
    "transformers",
    "typesense",
    "torch",
    "torchao",
    "wheel",
    "openai>=1.93.0",
    "pydantic-settings>=2.10.1",
    "hf-transfer>=0.1.9",
    "huggingface-hub[hf-xet]>=0.33.2",
    "safetensors>=0.5.3",
    "tokenizers>=0.21.2",
    "protobuf>=6.31.1",
    "accelerate>=1.8.1",
    "torch",
    "torchao",
]
requires-python = ">=3.12"
description = "Expand your vocabulary with wordsea!"

[dependency-groups]
dev = ["mypy>=1.15.0", "ruff>=0.11.4", "tox>=4.27.0", "tox-uv>=1.26.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchao = [{ index = "pytorch-cu128" }]
pytorch-triton = [{ index = "triton" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[[tool.uv.index]]
name = "triton"
url = "https://download.pytorch.org/whl/nightly/pytorch-triton"
explicit = true

[project.scripts]
wordsea = "wordsea:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["C901", "E501"]
select = ["B", "C", "E", "F", "I", "PD", "PTH", "RUF", "W"]
isort.known-first-party = ["wordsea"]

[tool.mypy]
files = "wordsea/**/*.py"
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true

show_error_codes = true
enable_error_code = ["ignore-without-code"]
ignore_missing_imports = true
strict_optional = false
warn_return_any = false
allow_redefinition = true
